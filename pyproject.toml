[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-ai-research"
version = "0.1.0"
description = "Evidence-led Indian equity research using official NSE MCP services"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "mcp>=1.0.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "streamlit>=1.35.0",
  "plotly>=5.22.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "PyYAML>=6.0.1",
  "APScheduler>=3.10.4",
  "SQLAlchemy>=2.0.30",
  "aiosqlite>=0.20.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.7", "ruff>=0.4.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires live network access and NSE MCP availability"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
